name: Check citation links

on:
  schedule:
    # 09:00 UTC daily
    - cron: "0 9 * * *"
  workflow_dispatch:
  # On a PR that touches the rules or the checker, run as a report (never fails the PR).
  pull_request:
    paths:
      - "data/rules/**"
      - "scripts/checkLinks.ts"
      - ".github/workflows/check-links.yml"

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check every citation URL
        # Strict (job fails on any genuinely broken link; bot-blocked hosts only warn) only on the nightly schedule.
        run: bun scripts/checkLinks.ts ${{ github.event_name == 'schedule' && '--strict' || '' }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: data/link-report.json
